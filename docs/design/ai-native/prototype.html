<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ganit · Ask — click-through prototype</title>
<style>
  :root{
    --winbg:#1e1e1e; --side:#28282a; --fg:#fff; --fg2:#98989d; --fg3:#5e5e63;
    --sep:rgba(255,255,255,.10); --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2;
    --blue:#0a84ff; --green:#32d74b; --field:#3a3a3c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0d0d0e;color:#eaeaea;font:14px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       display:flex;gap:22px;padding:20px 24px;align-items:flex-start}
  @media (max-width:1520px){ #stage{flex:0 1 auto;min-width:0} .win{width:min(1010px,calc(100vw - 430px))}
                             #rail{min-width:330px} }
  code{font:12px ui-monospace,Menlo,monospace}

  /* ── left: the app ─────────────────────────────────────────── */
  #stage{flex:0 0 1010px}
  .win{width:1010px;height:640px;background:var(--winbg);border-radius:11px;overflow:hidden;
       box-shadow:0 26px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.09);display:flex;position:relative}
  .side{width:196px;flex:0 0 196px;background:var(--side);border-right:1px solid var(--sep);padding:0 10px;font-size:13px}
  .lights{display:flex;gap:8px;padding:14px 6px 12px}
  .lights i{width:12px;height:12px;border-radius:50%;background:#545456;display:block}
  .grp{color:var(--fg3);font-size:11px;font-weight:600;padding:12px 8px 5px;letter-spacing:.02em}
  .nav{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;color:#d8d8dc}
  .nav svg{opacity:.75}
  .nav.sel{background:rgba(255,255,255,.10);color:var(--blue)}
  .nav.sel svg{opacity:1}
  .sub-date{color:var(--fg3);font-size:11px;padding:0 8px 2px 32px;margin-top:-4px}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid transparent}
  .bar .t{font-weight:600;color:#8e8e93;font-size:15px}
  .bar .sp{flex:1}
  .iconbtn{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--fg2);font-size:13px}
  .search{width:300px;height:28px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--fg2);
          display:flex;align-items:center;gap:7px;padding:0 10px;font-size:13px}
  #editor{flex:1;position:relative;padding:14px 26px 40px 24px;overflow:hidden}
  .row{display:grid;grid-template-columns:1fr 208px;grid-template-rows:26px;align-items:center}
  .row .src{white-space:pre;overflow:hidden;font-size:14.5px;color:#f2f2f4;position:relative}
  .row .ans{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
            font-size:14px;color:#f2f2f4;border-left:1px solid rgba(255,255,255,.055);padding-left:18px;padding-right:2px;
            overflow:hidden;white-space:nowrap}
  .h .src{font-weight:650}
  .h .src b{color:var(--fg3);font-weight:500}
  .c .src{color:var(--fg3)}
  .md .src{color:#d6d6da}
  .err{border-bottom:2px dotted var(--red)}
  .failmsg{color:var(--red);font-family:-apple-system,system-ui;font-size:13px}
  .row.on .src{background:rgba(10,132,255,.26);border-radius:3px}
  .caret{display:inline-block;width:1.5px;height:17px;background:var(--blue);vertical-align:-3px;margin-left:1px;animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .num{position:absolute;left:-19px;color:var(--fg3);font-size:11px;font-family:ui-monospace,Menlo}
  .askchip{font-size:11px;color:var(--purple);border:1px solid rgba(191,90,242,.55);border-radius:5px;
           padding:0 6px;line-height:16px;background:none;font-family:-apple-system;cursor:pointer}
  .askchip:hover{background:rgba(191,90,242,.14)}
  .aibadge{font-size:10px;color:var(--purple);border:1px solid rgba(191,90,242,.6);border-radius:4px;
           padding:0 4px;line-height:14px;margin-left:8px;vertical-align:1px;font-family:-apple-system;font-weight:600;cursor:pointer}
  .saidbadge{font-size:10px;color:var(--blue);border:1px solid rgba(10,132,255,.55);border-radius:4px;
             padding:0 4px;line-height:14px;margin-left:8px;vertical-align:1px;font-family:-apple-system;font-weight:600}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--purple);margin-right:6px;vertical-align:1px}
  .aicomment{color:rgba(191,90,242,.62)}
  .sumbar{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--sep);padding:6px 26px;
          font-size:12px;color:var(--fg2);display:flex;gap:16px;align-items:center;background:var(--winbg)}
  .sumbar .go{color:var(--blue);cursor:pointer;margin-left:auto}

  /* ── overlays ──────────────────────────────────────────────── */
  .panel{position:absolute;background:#2b2b2e;border:1px solid rgba(255,255,255,.16);border-radius:10px;
         box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:9}
  .ask{left:24px;width:600px;padding:10px 12px 9px}
  .ask .field{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:7px;padding:7px 10px}
  .ask .field .glyph{color:var(--purple);font-weight:700;font-size:12px}
  .ask .q{font-size:14.5px;color:#fff}
  .ask .q.ph{color:var(--fg3)}
  .ask .meta{display:flex;gap:14px;align-items:center;color:var(--fg3);font-size:11.5px;padding:7px 2px 0}
  .ask .meta b{color:var(--fg2);font-weight:500}
  .ask .status{color:var(--fg2);font-size:12px;padding:7px 2px 0}
  .ask .quiet{color:var(--fg3);font-size:11.5px;padding:2px 2px 0}
  .ctxbox{margin:8px 2px 0;border:1px solid var(--sep);border-radius:7px;padding:7px 10px;font-size:11.5px;color:var(--fg2)}
  .ctxbox div{font-family:ui-monospace,Menlo;color:#cfcfd3;padding:1px 0}
  .chips{display:flex;gap:6px;padding:8px 2px 0}
  .chips span{border:1px solid var(--sep);border-radius:20px;padding:2px 10px;font-size:12px;color:#d8d8dc;cursor:pointer}
  .crumb{display:flex;gap:8px;align-items:center;color:var(--fg2);font-size:12px;padding:0 2px 7px}
  .crumb b{color:#fff;font-weight:500}

  .prop{left:24px;width:660px;padding:0;overflow:hidden}
  .prop .hd{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.05);
            font-size:12px;color:var(--fg2);border-bottom:1px solid var(--sep)}
  .prop .hd b{color:#fff;font-weight:600;font-size:12.5px}
  .prop .body{padding:6px 12px 8px}
  .pl{display:grid;grid-template-columns:1fr 208px;align-items:center;grid-template-rows:25px;cursor:pointer}
  .pl .s{font-size:14px;white-space:pre;overflow:hidden}
  .pl .a{text-align:right;font-family:ui-monospace,Menlo;font-variant-numeric:tabular-nums;font-size:13.5px;
         border-left:1px solid rgba(255,255,255,.055);padding-left:18px;white-space:nowrap;overflow:hidden}
  .pl .mk{display:inline-block;width:64px;font-size:10px;font-weight:700;letter-spacing:.05em;
          text-transform:uppercase;margin-left:-2px;padding-right:8px}
  .pl.add .mk{color:var(--green)} .pl.del .mk{color:var(--red)} .pl.chg .mk{color:var(--orange)}
  .pl.del,.pl.off{opacity:.45;text-decoration:line-through}
  .pl.off .mk{color:var(--fg3)}
  .pl .tk{font-size:10px;color:var(--fg3);border:1px solid var(--sep);border-radius:3px;padding:0 3px;margin-right:6px}
  .prop .ft{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--sep);
            background:rgba(255,255,255,.03);font-size:12px;color:var(--fg2)}
  .prop .ft .ok{color:var(--green)}
  .prop .ft .sp{flex:1}
  button.b{font:12.5px -apple-system;background:rgba(255,255,255,.09);color:#eaeaea;border:1px solid rgba(255,255,255,.12);
           border-radius:6px;padding:4px 11px;cursor:pointer}
  button.b:hover{background:rgba(255,255,255,.15)}
  button.pri{background:var(--blue);border-color:transparent;color:#fff;font-weight:500}
  button.pri:hover{background:#339cff}

  .card{width:400px;padding:12px 14px 10px;right:26px}
  .card .ch{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .card .ch .k{color:var(--purple)}
  .card table{border-collapse:collapse;width:100%;font-size:12.5px}
  .card td{padding:3px 0;vertical-align:top;color:#cfcfd3}
  .card td.k{color:var(--fg2);width:88px;text-align:right;padding-right:12px}
  .card .mono{font-family:ui-monospace,Menlo}
  .card .ft{display:flex;gap:7px;justify-content:flex-end;margin-top:11px}
  .card .fine{color:var(--fg3);font-size:11.5px;margin-top:9px;border-top:1px solid var(--sep);padding-top:8px}

  .failcard{width:470px;left:24px;padding:13px 15px}
  .failcard .t{font-weight:600;margin-bottom:4px}
  .failcard .m{font-size:13px;color:#cfcfd3}
  .failcard .m code{background:rgba(255,255,255,.08);color:#fff}
  .failcard .ft{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}

  .menu{position:absolute;top:44px;left:330px;width:266px;padding:5px;z-index:20}
  .menu div{padding:4px 10px;border-radius:5px;font-size:13px;color:#d8d8dc;display:flex}
  .menu div.dis{color:var(--fg3)}
  .menu div .k{margin-left:auto;color:var(--fg3);font-size:11.5px}
  .menu div.hi{background:var(--blue);color:#fff}
  .menu div.se{border-top:1px solid var(--sep);margin:4px 0;padding:0}

  .settings{position:absolute;inset:0;background:var(--winbg);padding:22px 26px;z-index:12;overflow:auto}
  .settings h4{margin:0 0 3px;font-size:15px}
  .settings p.lead{color:var(--fg2);font-size:12.5px;max-width:640px;margin:0 0 16px}
  .sgrid{display:grid;grid-template-columns:120px 380px;gap:8px 12px;align-items:center;font-size:13px}
  .sgrid label{color:var(--fg2);text-align:right}
  .sgrid input,.sgrid select{background:var(--field);border:1px solid rgba(255,255,255,.14);border-radius:6px;
        color:#fff;padding:5px 8px;font:13px -apple-system;width:100%}
  .settings .rowb{display:flex;gap:8px;margin:16px 0 0 132px}
  .settings .priv{margin:18px 0 0 132px;color:var(--fg3);font-size:11.5px;max-width:560px;border-top:1px solid var(--sep);padding-top:12px}

  /* ── right: walkthrough rail ───────────────────────────────── */
  #rail{flex:1;min-width:400px;max-width:470px;position:sticky;top:20px}
  #rail h1{font-size:17px;margin:0 0 2px}
  #rail .sub{color:var(--fg3);font-size:12px;margin:0 0 14px}
  .scens{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
  .scens button{font:11.5px -apple-system;background:#1b1b1e;border:1px solid var(--sep);color:var(--fg2);
                border-radius:20px;padding:3px 10px;cursor:pointer}
  .scens button.on{background:rgba(191,90,242,.17);border-color:rgba(191,90,242,.6);color:#fff}
  .step{font-size:13px;color:#c7c7cc;background:#171719;border:1px solid var(--sep);border-radius:9px;padding:12px 14px;margin-bottom:10px}
  .step .st{color:#fff;font-weight:600;font-size:14px;margin-bottom:6px}
  .step .you{color:var(--green);font-weight:600}
  .step .bg{color:var(--fg3);font-size:12px;border-top:1px solid var(--sep);margin-top:9px;padding-top:8px}
  .step .bg b{color:var(--purple);font-weight:600}
  .nav-b{display:flex;gap:8px;align-items:center}
  .nav-b .dots{margin-left:auto;color:var(--fg3);font-size:12px}
  .kbd{font:11px ui-monospace,Menlo;border:1px solid var(--sep);border-radius:4px;padding:1px 5px;color:var(--fg2)}
  .hint{color:var(--fg3);font-size:11.5px;margin-top:10px}
</style>
</head>
<body>
<div id="stage"><div class="win" id="win"></div></div>
<div id="rail">
  <h1>Ganit · <span style="color:var(--purple)">Ask</span></h1>
  <p class="sub">Click-through prototype · one operation, four outcomes · nothing here is production code</p>
  <div class="scens" id="scens"></div>
  <div class="step" id="step"></div>
  <div class="nav-b">
    <button class="b" id="prev">◀ Back</button>
    <button class="b pri" id="next">Next ▶</button>
    <span class="dots" id="dots"></span>
  </div>
  <p class="hint">Keys: <span class="kbd">→</span> <span class="kbd">←</span> move between states. Things that look
  clickable in the window (the <b>Ask</b> chip, <b>Ask Ganit…</b>, <b>Apply</b>) advance the story.</p>
</div>

<script>
/* ───────────────────────── data ───────────────────────── */
const A=(t,k)=>({t,k});                       // answer: k = ok|fail|pend|none
const sidebar = `
 <div class="lights"><i></i><i></i><i></i></div>
 <div class="grp">Library</div>
 <div class="nav"><svg width="14" height="14"><path d="M1 5h12v7H1z M3 5l1-2h6l1 2" fill="none" stroke="currentColor"/></svg>All Sheets</div>
 <div class="nav"><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor"/><path d="M7 4v3l2 2" stroke="currentColor" fill="none"/></svg>Recent</div>
 <div class="nav"><svg width="14" height="14"><path d="M7 1l2 4 4 .5-3 3 .8 4L7 10.6 3.2 12.5 4 8.5 1 5.5 5 5z" fill="none" stroke="currentColor"/></svg>Favorites</div>
 <div class="nav"><svg width="14" height="14"><path d="M1 5h12v7H1z M1 5l1.5-3h9L13 5" fill="none" stroke="currentColor"/></svg>Archive</div>
 <div class="nav"><svg width="14" height="14"><path d="M2 4h10l-1 9H3z" fill="none" stroke="currentColor"/></svg>Trash</div>
 <div class="grp" style="border-top:1px solid var(--sep);margin-top:10px;padding-top:12px">Scratch</div>
 <div class="sub-date">now</div>`;

const L=(o)=>o;   // line: {t,kind,ans,sel,caret,chip,err,ai,said,dot}
const tripSheet=[
 L({t:'<b>#</b> Trip to Goa',kind:'h'}),
 L({t:''}),
 L({t:'hotel = 185 USD',ans:A('185 USD')}),
 L({t:'nights = 6',ans:A('6')}),
 L({t:'flight = 680 USD',ans:A('680 USD')}),
 L({t:''}),
 L({t:'trip_total = hotel * nights + flight',ans:A('1,790 USD')}),
];
const partySheet=[
 L({t:'<b>#</b> Party for 20',kind:'h'}),
 L({t:''}),
 L({t:'drinks = 2,400',ans:A('2,400')}),
 L({t:'food = 5,600',ans:A('5,600')}),
 L({t:'cake = 1,200',ans:A('1,200')}),
 L({t:'subtotal',ans:A('9,200')}),
 L({t:''}),
 L({t:'// a tenth for the tip',kind:'c'}),
 L({t:'10% of line 6',ans:A('920')}),
];

const SC=[
/* ── 1 ─────────────────────────────────────────────────── */
{id:'plain',name:'Plain Ganit',title:'Baseline — no AI anywhere',steps:[
 {you:'You just use Ganit.',
  note:'This is the whole product with AI switched off: source on the left, answers on the right, nothing purple, no buttons. Everything below has to leave this screen untouched.',
  bg:'<b>Design rule:</b> the answer column is written only by Ganit. That is what makes a purple mark on it meaningful later.',
  sheet:tripSheet},
]},

/* ── 2 ─────────────────────────────────────────────────── */
{id:'loan',name:'1 · Words → calculation',title:'',steps:[
 {you:'You type a sentence into a line and stop.',
  note:'Ganit can’t read it, so it says so — and puts a quiet <b>Ask</b> on <em>that one line only</em>. Nothing has left the Mac: detecting prose is local.',
  bg:'<b>Ganit:</b> classifies the line as prose. <b>Model:</b> not contacted. The old 1.2-second auto-request is gone — ADR 0012 promises “a request nobody makes without asking for it”, and auto-sending broke that promise.',
  sheet:[L({t:'<b>#</b> Home loan',kind:'h'}),L({t:''}),
         L({t:'I’m borrowing ₹25 lakh for 5 years at 8.2%. What will I pay monthly?',kind:'md',caret:1,chip:1})]},

 {you:'You press <span class="kbd">⌘⇧A</span> (or click <b>Ask</b>).',
  note:'The Ask bar opens at the caret with the line already in it, so an unparseable line needs no typing. The <code>Context</code> line says exactly what will be sent, before it is sent.',
  bg:'<b>One door.</b> ⌘⇧A, right-click, the caret chip and the selection bar all open this same bar — no separate “explain”, “transform”, “generate” commands.',
  sheet:[L({t:'<b>#</b> Home loan',kind:'h'}),L({t:''}),
         L({t:'I’m borrowing ₹25 lakh for 5 years at 8.2%. What will I pay monthly?',kind:'md'}),
        ],
  ov:{type:'ask',at:2,q:'I’m borrowing ₹25 lakh for 5 years at 8.2%. What will I pay monthly?',meta:'Context: this line only · gpt-4o-mini',hint:'⏎ to ask · Esc to dismiss'}},

 {you:'⏎',
  note:'The bar stays open, the sheet stays editable, and the status line is the entire UI for “the model is working”.',
  bg:'<b>Model:</b> translates intent into Ganit source. <b>Ganit:</b> parses, type-checks, units-checks and evaluates the patch on a shadow copy of the sheet. <b>The model never produces the number.</b>',
  sheet:[L({t:'<b>#</b> Home loan',kind:'h'}),L({t:''}),
         L({t:'I’m borrowing ₹25 lakh for 5 years at 8.2%. What will I pay monthly?',kind:'md'})],
  ov:{type:'ask',at:2,q:'I’m borrowing ₹25 lakh for 5 years at 8.2%. What will I pay monthly?',status:'Ganit is checking…'}},

 {you:'A proposal appears where the prose was.',
  note:'These are <b>not</b> pictures of an answer — Ganit really evaluated them, which is why the answer column is populated. Nothing has been written to the sheet yet. Note the comment line: the model’s interpretation is offered as ordinary, deletable text.',
  bg:'<b>Shape = contract.</b> Anything that touches source is previewed and needs Apply. Anything read-only is a transient card. There is no mode switch because the outcome tells you which it was.',
  sheet:[L({t:'<b>#</b> Home loan',kind:'h'}),L({t:''}),
         L({t:'I’m borrowing ₹25 lakh for 5 years at 8.2%. What will I pay monthly?',kind:'md'})],
  ov:{type:'prop',at:2,hd:'<b>Proposed</b> · replaces 1 line with 7',
      lines:[{m:'del',s:'I’m borrowing ₹25 lakh for 5 years at 8.2%. What will I pay monthly?'},
             {m:'add',s:'principal = 2500000 INR',a:'₹2,500,000'},
             {m:'add',s:'annual_rate = 8.2%',a:'8.2%'},
             {m:'add',s:'years = 5',a:'5'},
             {m:'add',s:'monthly = pmt(principal, annual_rate / 12, years * 12)',a:'₹50,931'},
             {m:'add',s:'total_paid = monthly * years * 12',a:'₹3,055,860'},
             {m:'add',s:'interest = total_paid - principal',a:'₹555,860'},
             {m:'add',s:'<span class="aicomment">// 8.2% is the annual rate → charged monthly; 5 years = 60 payments</span>'}],
      ft:'<span class="ok">✓</span> Ganit checked all 7 lines · they calculate · no model-supplied numbers',
      btns:['Apply ⌘↩','Ask again','Discard ⎋']}},

 {you:'⌘↩ — Apply.',
  note:'Ordinary source. The purple is gone from the screen; what remains is a comment you can edit or delete. It is <b>not</b> badged as AI-written, because Ganit verified it — badges mark where a <em>number</em> came from, not who typed it.',
  bg:'<b>Apply is one Undo step</b> named <em>“Apply AI change”</em>, using the sheet’s existing named-patch machinery (tables already do this). No AI-specific undo stack.',
  sheet:[L({t:'<b>#</b> Home loan',kind:'h'}),L({t:''}),
         L({t:'principal = 2500000 INR',ans:A('₹2,500,000')}),
         L({t:'annual_rate = 8.2%',ans:A('8.2%')}),
         L({t:'years = 5',ans:A('5')}),
         L({t:'monthly = pmt(principal, annual_rate / 12, years * 12)',ans:A('₹50,931')}),
         L({t:'total_paid = monthly * years * 12',ans:A('₹3,055,860')}),
         L({t:'interest = total_paid - principal',ans:A('₹555,860')}),
         L({t:'<span class="aicomment">// 8.2% is the annual rate → charged monthly; 5 years = 60 payments</span>',kind:'c'})]},

 {you:'Next week you change 2500000 to 3000000.',
  note:'Same digits you’d change in any notepad. No AI, no waiting, no confirmation.',
  bg:'<b>The whole point.</b> Because AI wrote source rather than an answer, the work is now subject to Ganit’s normal determinism. Had the model returned “₹61,117”, this edit would need a second question to a model.',
  sheet:[L({t:'<b>#</b> Home loan',kind:'h'}),L({t:''}),
         L({t:'principal = <span class="err" style="border:0">3000000</span> INR',ans:A('₹3,000,000')}),
         L({t:'annual_rate = 8.2%',ans:A('8.2%')}),
         L({t:'years = 5',ans:A('5')}),
         L({t:'monthly = pmt(principal, annual_rate / 12, years * 12)',ans:A('₹61,117')}),
         L({t:'total_paid = monthly * years * 12',ans:A('₹3,667,020')}),
         L({t:'interest = total_paid - principal',ans:A('₹667,020')}),
         L({t:'<span class="aicomment">// 8.2% is the annual rate → charged monthly; 5 years = 60 payments</span>',kind:'c'})]},
]},

/* ── 3 ─────────────────────────────────────────────────── */
{id:'prose',name:'2 · Prose → a model',title:'',steps:[
 {you:'A paragraph, and an instruction on what to do with it.',
  note:'Same bar. The difference is only that a multi-line result is expected, so the target is the selection.',
  bg:'<b>Context sent:</b> the selected lines, plus the declaration lines they transitively read — not the sheet, its title, or the machine.',
  sheet:[L({t:'<b>#</b> Flat vs rent',kind:'h'}),L({t:''}),

/* ───────────────────────── render ───────────────────────── */
let si=0, ti=0;
const $=s=>document.querySelector(s);
function renderScens(){
  $('#scens').innerHTML=SC.map((s,i)=>`<button class="${i===si?'on':''}" data-i="${i}">${s.name}</button>`).join('');
  $('#scens').querySelectorAll('button').forEach(b=>b.onclick=()=>{si=+b.dataset.i;ti=0;render()});
}
function esc(x){return x}
function renderSheet(s){
  return s.map((l,i)=>{
    const cls=['row',l.kind||'',l.sel?'on':''].filter(Boolean).join(' ');
    let ans='';
    if(l.chip) ans=`<button class="askchip adv">Ask</button>`;
    else if(l.ans){ ans = l.ans.k==='fail' ? `<span class="failmsg">${l.ans.t}</span>` :
                (l.dot?`<span class="dot"></span>`:'')+l.ans.t; }
    return `<div class="${cls}" data-r="${i}"><div class="src">${l.t||''}${l.caret?'<span class="caret"></span>':''}</div><div class="ans">${ans}</div></div>`;
  }).join('');
}
function askBar(o){
  let h=`<div class="panel ask" data-at="${o.at}">`;
  if(o.crumb) h+=`<div class="crumb"><span style="color:var(--fg3)">‹</span>“<b>${o.crumb}</b>”${o.badge?` <span style="border:1px solid var(--sep);border-radius:20px;padding:0 8px;font-size:11px">${o.badge}</span>`:''}</div>`;
  h+=`<div class="field"><span class="glyph">AI</span><span class="q ${o.q?'':'ph'}">${o.q||o.ph||''}</span></div>`;
  if(o.chips) h+=`<div class="chips">${o.chips.map(c=>`<span class="adv">${c}</span>`).join('')}</div>`;
  if(o.status) h+=`<div class="status">${o.status}</div>`;
  if(o.quiet) h+=`<div class="quiet">${o.quiet}</div>`;
  if(o.ctx) h+=`<div class="ctxbox">${o.ctx.map(c=>`<div>${c}</div>`).join('')}</div>`;
  if(o.meta) h+=`<div class="meta"><b>${o.meta}</b>${o.hint?`<span style="margin-left:auto">${o.hint}</span>`:''}</div>`;
  return h+'</div>';
}
function propBar(o){
  let h=`<div class="panel prop" data-at="${o.at}"><div class="hd">${o.hd}</div><div class="body">`;
  const MK={add:'＋ add',del:'− remove',chg:'~ change'};
  o.lines.forEach(l=>{h+=`<div class="pl ${l.m} ${l.off?'off':''}"><div class="s"><span class="mk">${l.off?'· off':MK[l.m]}</span>${l.s}${l.b?`<span class="${l.b==='ai'?'aibadge':'saidbadge'}">${l.b==='ai'?'AI':'said'}</span>`:''}</div><div class="a">${l.a||''}</div></div>`});
  h+=`</div><div class="ft"><span>${o.ft}</span><span class="sp"></span>${o.btns.map((b,i)=>`<button class="b ${i===0?'pri adv':''}">${b}</button>`).join('')}</div></div>`;
  return h;
}
function card(o){
  let h=`<div class="panel card" data-at="${o.at}"><div class="ch">${o.head}</div><table>`;
  o.rows.forEach(r=>h+=`<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`);
  h+=`</table>${o.fine?`<div class="fine">${o.fine}</div>`:''}<div class="ft">${o.btns.map((b,i)=>`<button class="b ${i===0?'pri adv':''}">${b}</button>`).join('')}</div></div>`;
  return h;
}
function fail(o){
  return `<div class="panel failcard" data-at="${o.at}"><div class="t">${o.t}</div><div class="m">${o.m}</div>
   <div class="ft">${o.btns.map((b,i)=>`<button class="b ${i===0?'pri adv':''}">${b}</button>`).join('')}</div></div>`;
}
const SETTINGS=`<div class="settings">
 <h4>AI</h4>
 <p class="lead">Ganit does every calculation. A model only turns what you mean into Ganit source, and supplies facts about the world that Ganit doesn’t have. Nothing is sent until you press ⏎ in the Ask bar.</p>
 <div class="sgrid">
   <label><input type="checkbox" style="width:auto;vertical-align:-1px"> Turn AI on</label><span style="color:var(--fg2);font-size:12px">Off until you set it up, as today.</span>
   <label>Address</label><input value="http://localhost:11434/v1">
   <label>Model</label><input value="qwen2.5-coder:7b">
   <label>API key</label><input type="password" placeholder="Not needed for a local model">
   <label>Repair attempts</label><select><option>0 — validate once</option><option selected>2 (default)</option><option>3</option></select>
   <label>Answers</label><span style="color:var(--fg2);font-size:12px"><input type="checkbox" checked style="width:auto;vertical-align:-1px"> Mark answers that depend on an AI-supplied value</span>
 </div>
 <div class="rowb"><button class="b">Try It</button><button class="b pri">Save</button></div>
 <div class="priv"><b style="color:#98989d">What leaves this Mac.</b> One Ask request carries the lines you selected plus the lines they read, the instruction you typed, and the model name. Not the rest of the sheet, not its title, nothing else about this Mac. The <code>Context ▸</code> disclosure in the Ask bar always shows the exact lines before they go. HTTPS, except on this Mac. The key lives in the keychain.</div>
</div>`;

function render(){
  const S=SC[si], st=S.steps[ti];
  $('#win').innerHTML=`<div class="side">${sidebar}</div><div class="main">
    <div class="bar"><span class="t">${(st.sheet&&st.sheet[0]&&st.sheet[0].t.replace(/<[^>]+>/g,'').replace(/^#\s*/,''))||S.name}</span><span class="sp"></span>
      <span class="iconbtn">✎</span><span class="search"><span style="opacity:.6">⌕</span> Search</span></div>
    <div id="editor">${st.sheet?renderSheet(st.sheet):''}
      ${st.sum?`<div class="sumbar"><span>${st.sum}</span>${st.sumGo?'<span class="go adv">Ask Ganit…</span>':''}</div>`:''}
      ${st.ov&&({ask:askBar,prop:propBar,card:card,fail:fail})[st.ov.type]?({ask:askBar,prop:propBar,card:card,fail:fail})[st.ov.type](st.ov):''}
      ${st.ov&&st.ov.type==='menu'?`<div class="panel menu">${st.ov.items.map(i=>{const[d,dis]=i.split('|');return i==='—'?'<div class="se"></div>':`<div class="${dis||d.startsWith('Ask')?'dis':''}">${d}</div>`}).join('')}</div>`:''}
      ${st.ov&&st.ov.type==='settings'?SETTINGS:''}
    </div></div>`;
  // anchor panels to their line
  const ed=$('#editor');
  if(ed){ ed.querySelectorAll('.panel[data-at]').forEach(p=>{
    const at=+p.dataset.at; const row=ed.querySelector(`[data-r="${at}"]`);
    if(row){ const r=row.getBoundingClientRect(), e=ed.getBoundingClientRect();
      p.style.top=(r.bottom-e.top+5)+'px';
      if(p.classList.contains('card')) p.style.top=(r.bottom-e.top+5)+'px'; }
  }); }
  const title=st.you;
  $('#step').innerHTML=`<div class="st">${title}</div><p style="margin:0 0 8px">${st.note||''}</p><div class="bg">${st.bg||''}</div>`;
  $('#dots').textContent=`${si+1}/${SC.length} · ${ti+1}/${S.steps.length}`;
  $('#win').querySelectorAll('.adv').forEach(el=>el.onclick=next);
  renderScens();
}
function next(){const S=SC[si]; if(ti<S.steps.length-1){ti++;render()} }
function prev(){if(ti>0){ti--;render()}}
$('#next').onclick=next; $('#prev').onclick=prev;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev();});
render();
</script>
