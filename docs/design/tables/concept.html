  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ganit-tables-concept&#x27;);

      const initialRows = [{name:&#x27;Drinks&#x27;,qty:20,price:120},{name:&#x27;Food&#x27;,qty:20,price:280},{name:&#x27;Cake&#x27;,qty:1,price:1200}];

      function applySaved(snapshot) {
        const savedRows = snapshot &amp;&amp; snapshot.modelContent &amp;&amp; snapshot.modelContent.rows;
        if (Array.isArray(savedRows) &amp;&amp; savedRows.length &gt; 0 &amp;&amp; savedRows.length &lt;= 30 &amp;&amp; savedRows.every(row =&gt; row &amp;&amp; typeof row.name === &#x27;string&#x27; &amp;&amp; Number.isFinite(row.qty) &amp;&amp; Number.isFinite(row.price) &amp;&amp; row.qty &gt;= 0 &amp;&amp; row.price &gt;= 0)) {
          rows = savedRows.map(row =&gt; ({name:row.name.slice(0,60),qty:row.qty,price:row.price}));
          selected = Math.min(selected, rows.length - 1);
        }
      }
      applySaved(window.openai &amp;&amp; window.openai.widgetState);
      function remember() {
        if (window.openai &amp;&amp; window.openai.setWidgetState) window.openai.setWidgetState({modelContent:{concept:&#x27;Ganit table blocks with expanded editing&#x27;,rows:rows.map(row=&gt;({...row}))},privateContent:{selectedRow:selected}}).catch(()=&gt;{});
      }
      function amount(row) { return Math.round(row.qty * Math.round(row.price * 100)); }
      function total() { return rows.reduce((sum,row)=&gt;sum+amount(row),0); }
      function refresh() {
        root.querySelectorAll(&#x27;[data-total-output]&#x27;).forEach(output=&gt;{output.textContent=money.format(total()/100);});
        root.querySelectorAll(&#x27;[data-person-output]&#x27;).forEach(output=&gt;{output.textContent=money.format(total()/2000);});
        root.querySelectorAll(&#x27;[data-row-count]&#x27;).forEach(output=&gt;{output.textContent=rows.length+&#x27; data rows&#x27;;});
        localState.forEach(state=&gt;{
          state.view.classList.toggle(&#x27;gt-show-addresses&#x27;, state.addresses);
          state.view.querySelectorAll(&#x27;[data-amount-row]&#x27;).forEach(button=&gt;{
            const index=Number(button.dataset.amountRow);
            button.textContent=state.formulas?&#x27;=B&#x27;+(index+2)+&#x27; * C&#x27;+(index+2):money.format(amount(rows[index])/100);

          });
          state.view.querySelector(&#x27;[data-table-total]&#x27;).textContent=money.format(total()/100);
          state.view.querySelector(&#x27;[data-formula-address]&#x27;).textContent=&#x27;D&#x27;+(selected+2);
          state.view.querySelector(&#x27;[data-formula-source]&#x27;).value=&#x27;=[@Qty] * [@[Unit price]]&#x27;;
          state.view.querySelector(&#x27;[data-formula-status]&#x27;).textContent=&#x27;Amount · &#x27;+rows[selected].name+&#x27; · column formula&#x27;;
          state.view.querySelector(&#x27;[data-show-formulas]&#x27;).setAttribute(&#x27;aria-pressed&#x27;,String(state.formulas));
        });
      }
      function buildView(state,index) {
        const view=state.view;
        view.innerHTML=&#x27;&lt;div class=&quot;gt-table-toolbar&quot;&gt;&lt;span class=&quot;gt-table-title&quot;&gt;Items &lt;span aria-label=&quot;Calculated column&quot;&gt;· Amount ƒ&lt;/span&gt;&lt;/span&gt;&lt;div class=&quot;gt-controls&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-show-formulas aria-pressed=&quot;false&quot;&gt;Show formulas&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-add-row&gt;Add row&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;gt-scroll&quot;&gt;&lt;table aria-label=&quot;Items quantities, prices and calculated amounts&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th class=&quot;gt-address&quot; scope=&quot;col&quot;&gt;Row&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;&lt;span class=&quot;gt-address-inline&quot;&gt;A&lt;/span&gt;Item&lt;/th&gt;&lt;th class=&quot;gt-numeric&quot; scope=&quot;col&quot;&gt;&lt;span class=&quot;gt-address-inline&quot;&gt;B&lt;/span&gt;Qty&lt;/th&gt;&lt;th class=&quot;gt-numeric&quot; scope=&quot;col&quot;&gt;&lt;span class=&quot;gt-address-inline&quot;&gt;C&lt;/span&gt;Unit price&lt;span&gt;INR&lt;/span&gt;&lt;/th&gt;&lt;th class=&quot;gt-numeric&quot; scope=&quot;col&quot;&gt;&lt;span class=&quot;gt-address-inline&quot;&gt;D&lt;/span&gt;Amount&lt;span&gt;INR · formula&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;tfoot&gt;&lt;tr&gt;&lt;td class=&quot;gt-address&quot;&gt;&lt;/td&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;gt-numeric&quot; data-table-total&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;gt-formula&quot;&gt;&lt;label for=&quot;gt-formula-&#x27;+index+&#x27;&quot; data-formula-address&gt;D2&lt;/label&gt;&lt;input id=&quot;gt-formula-&#x27;+index+&#x27;&quot; data-formula-source readonly aria-label=&quot;Selected cell formula&quot;&gt;&lt;/div&gt;&lt;p class=&quot;gt-formula-status&quot; data-           const button=document.createElement(&#x27;button&#x27;);button.type=&#x27;button&#x27;;button.className=&#x27;gt-amount cursor-interaction&#x27;;button.dataset.amountRow=String(rowIndex);button.setAttribute(&#x27;aria-label&#x27;,&#x27;Inspect Amount formula for row &#x27;+(rowIndex+2));

          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
