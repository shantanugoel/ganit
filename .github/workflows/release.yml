name: Release

# Pushing a version tag publishes that version. A Mac app nobody can open is
# not a release, so this signs and notarizes before it publishes, and fails
# rather than offering a build Gatekeeper will refuse.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      GANIT_NOTARY_PROFILE: ganit-notary

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned toolchain
        run: |
          test "$(uname -m)" = "arm64"
          expected_xcode=$(<.xcode-version)
          actual_xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          test "$actual_xcode" = "$expected_xcode"

      - name: Check the tag against the app's version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' App/Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match App/Info.plist version $version." >&2
            exit 1
          fi
          # Sparkle compares CFBundleVersion, so a release whose two versions
          # disagree would offer itself to the people already running it.
          if [[ "$build" != "$version" ]]; then
            echo "CFBundleVersion $build does not match version $version." >&2
            exit 1
          fi

      - name: Test packages
        run: swift test --parallel

      - name: Unlock the signing identity
        env:
          CERTIFICATE: ${{ secrets.GANIT_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.GANIT_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.GANIT_APPLE_ID }}
          TEAM_ID: ${{ secrets.GANIT_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.GANIT_NOTARY_PASSWORD }}
        run: |
          # A keychain that exists for this run only, and is the one every
          # tool reaches for while it does.
          password=$(uuidgen)
          security create-keychain -p "$password" release.keychain
          security set-keychain-settings -lut 3600 release.keychain
          security unlock-keychain -p "$password" release.keychain
          security default-keychain -s release.keychain
          security list-keychains -d user -s release.keychain login.keychain

          printf '%s' "$CERTIFICATE" | base64 --decode >certificate.p12
          security import certificate.p12 -k release.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm certificate.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" release.keychain >/dev/null

          xcrun notarytool store-credentials "$GANIT_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD"

          identity=$(security find-identity -v -p codesigning release.keychain |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          test -n "$identity"
          echo "GANIT_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Build, sign, and notarize
        run: |
          # Without this the pipeline reports tee's success, not the build's.
          set -o pipefail
          ./scripts/release.sh | tee release.log
          echo "GANIT_DISK_IMAGE=$(tail -1 release.log)" >>"$GITHUB_ENV"

      - name: Describe the update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.GANIT_SPARKLE_PRIVATE_KEY }}
        run: |
          set -o pipefail
          # The feed lists this release only. Sparkle needs the newest version
          # to offer an update, and a reader who wants the history has the
          # releases page.
          updates=$(mktemp -d)
          cp "$GANIT_DISK_IMAGE" "$updates"
          generate_appcast=$(find .build/artifacts/sparkle -type f -name generate_appcast | head -1)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases" \
            "$updates"
          echo "GANIT_APPCAST=$updates/appcast.xml" >>"$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The feed lives at releases/latest/download/appcast.xml, which is
          # the URL every copy of Ganit asks, so it ships with every release.
          gh release create "$GITHUB_REF_NAME" "$GANIT_DISK_IMAGE" "$GANIT_APPCAST" \
            --title "Ganit ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Update the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.GANIT_TAP_DEPLOY_KEY }}
        run: |
          # The tap is its own repository, shantanugoel/homebrew-ganit, and a
          # deploy key is the only thing that can write to it. The cask points
          # at the disk image just published, so it changes only after that.
          version=${GITHUB_REF_NAME#v}
          sha256=$(shasum -a 256 "$GANIT_DISK_IMAGE" | awk '{ print $1 }')
          key=$(mktemp)
          printf '%s\n' "$TAP_DEPLOY_KEY" >"$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          tap=$(mktemp -d)
          git clone --depth 1 git@github.com:shantanugoel/homebrew-ganit.git "$tap"
          sed -i '' \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$sha256\"/" \
            "$tap/Casks/ganit.rb"
          grep -q "^  version \"$version\"$" "$tap/Casks/ganit.rb"
          grep -q "^  sha256 \"$sha256\"$" "$tap/Casks/ganit.rb"
          git -C "$tap" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Update Ganit to $version"
          git -C "$tap" push origin HEAD
          rm -f "$key"

      - name: Forget the signing identity
        if: always()
        run: security delete-keychain release.keychain || true
