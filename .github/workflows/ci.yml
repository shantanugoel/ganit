name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned toolchain
        run: |
          test "$(uname -m)" = "arm64"
          expected_xcode=$(<.xcode-version)
          actual_xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          test "$actual_xcode" = "$expected_xcode"

      - name: Check Swift formatting
        run: ./scripts/swift-format.sh lint

      - name: Verify generated unit attribution
        run: ./scripts/verify-unit-attribution.sh

      - name: Test packages
        run: |
          ruby -rjson -e '
            pins = JSON.parse(File.read("Package.resolved"))["pins"]
            pin = pins.find { |candidate| candidate["identity"] == "bigint" }
            abort "BigInt pin mismatch" unless pin &&
              pin["state"]["version"] == "6.0.1" &&
              pin["state"]["revision"] == "63feef7820abb1a8fb08587d7da56bb0b7db8751"
          '
          swift package dump-package >/dev/null
          swift test --parallel

      - name: Lay out windows with double-length strings
        run: GANIT_PSEUDOLOCALIZATION=1 swift test --filter PseudolocalizationTests

      - name: Exercise command-line calculator
        run: |
          test "$(swift run ganit '20% off 85')" = "68"
          test "$(printf 'rent = 2,100\nrent * 12\n' | swift run ganit)" = "$(printf '2,100\n25,200')"
          test "$(swift run ganit 'rent = 3' 'rent * 12')" = "$(printf '3\n36')"
          ! swift run ganit '1 m + 1 s'

      - name: Exercise internal engine harness
        run: |
          output=$(printf '1 + 2 * 3\n1 / 0\n' | swift run GanitEngineHarness)
          ruby -rjson -e '
            records = STDIN.each_line.map { |line| JSON.parse(line) }
            abort "Harness value mismatch" unless
              records[0]["status"] == "value" &&
              records[0]["fullPrecision"] == "7"
            abort "Harness error mismatch" unless
              records[1]["status"] == "evaluationFailure" &&
              records[1]["code"] == "evaluation.divisionByZero"
          ' <<<"$output"

      - name: Run engine corpus with Address Sanitizer
        run: |
          swift test --sanitize address \
            --filter 'GoldenCorpusTests|ArithmeticPropertyTests|ParserFuzzSmokeTests'

      - name: Build benchmark harness
        run: |
          swift build --configuration release --product GanitBenchmarks
          swift run --configuration release GanitBenchmarks --list
          swift run --configuration release GanitBenchmarks --parser 1000
          swift run --configuration release GanitBenchmarks --engine 10
          swift run --configuration release GanitBenchmarks --sheet mixed-sheet 5
          swift run --configuration release GanitBenchmarks --sheet chained-dependency-sheet 5
          swift run --configuration release GanitBenchmarks --editor mixed-sheet 5
          swift run --configuration release GanitBenchmarks --quick 5

      - name: Build application bundle
        run: ./scripts/build-app.sh release

      - name: Smoke test application launch
        run: ./scripts/measure-launch.sh 1

      - name: Validate application bundle
        run: ./scripts/verify-app.sh
