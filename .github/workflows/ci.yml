name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned toolchain
        run: |
          test "$(uname -m)" = "arm64"
          expected_xcode=$(<.xcode-version)
          actual_xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          test "$actual_xcode" = "$expected_xcode"

      - name: Check Swift formatting
        run: ./scripts/swift-format.sh lint

      - name: Test packages
        run: |
          ruby -rjson -e '
            pins = JSON.parse(File.read("Package.resolved"))["pins"]
            pin = pins.find { |candidate| candidate["identity"] == "bigint" }
            abort "BigInt pin mismatch" unless pin &&
              pin["state"]["version"] == "6.0.1" &&
              pin["state"]["revision"] == "63feef7820abb1a8fb08587d7da56bb0b7db8751"
          '
          swift package dump-package >/dev/null
          swift test --parallel

      - name: Build benchmark harness
        run: |
          swift build --configuration release --product GanitBenchmarks
          swift run --configuration release GanitBenchmarks --list
          swift run --configuration release GanitBenchmarks --parser 1000

      - name: Build application bundle
        run: ./scripts/build-app.sh release

      - name: Smoke test application launch
        run: ./scripts/measure-launch.sh 1

      - name: Validate application bundle
        run: ./scripts/verify-app.sh
